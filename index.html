<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="heading">Tic Tac Toe</h1>
    <div class="modes">
      <div id="turnIndicator">Player X's Turn</div>
      <button id="modeToggle">AI Mode</button>
    </div>
    <div class="container">
      <div class="row">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
      <div class="row">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
      <div class="row">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    </div>

    <div class="Complete hide">
      <div class="title"></div>
      <div class="name"></div>
      <button id="resetbtn">Restart</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
